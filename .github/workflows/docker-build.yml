name: Build and publish Docker image

# Single branch (main): this workflow rebuilds the image on push (if the
# Dockerfile or this workflow change), on a weekly schedule (to pick up
# updates to the official codeberg.org/forgejo/forgejo:15-rootless image,
# e.g. Alpine/Git security patches), and manually on demand.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-build.yml
  schedule:
    - cron: "0 3 * * 1" # every Monday at 03:00 UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted runners are amd64 only. QEMU lets buildx also produce
      # the arm64 and arm/v6 images, to exactly match the architectures
      # published by the official codeberg.org/forgejo/forgejo:15-rootless
      # image.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Same architectures as codeberg.org/forgejo/forgejo:15-rootless
          # (verified via `docker manifest inspect`): amd64, arm64, arm/v6.
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
